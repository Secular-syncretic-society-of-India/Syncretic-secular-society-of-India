<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSS-INDIA | Sovereign Motherboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .glitch-hover:hover { animation: glitch 0.3s infinite; }
    </style>
</head>
<body class="bg-black text-gray-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURATION GATE ---
        // UPDATE THESE TO MATCH YOUR ACTUAL REPO
        const GITHUB_ORG = 'Syedsmaeel'; 
        const GITHUB_REPO = 'Syncretic-secular-society-of-India';
        const BRANCH = 'main';

        function Dashboard() {
            const [mission, setMission] = useState('');
            const [ledger, setLedger] = useState('');
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('mission');

            const fetchData = async () => {
                setLoading(true);
                try {
                    const mRes = await fetch(`https://raw.githubusercontent.com/${GITHUB_ORG}/${GITHUB_REPO}/${BRANCH}/MISSION.md`);
                    const lRes = await fetch(`https://raw.githubusercontent.com/${GITHUB_ORG}/${GITHUB_REPO}/${BRANCH}/GARBAGE_LEDGER.md`);
                    setMission(await mRes.text());
                    setLedger(await lRes.text());
                } catch (e) {
                    console.error("Signal Lost", e);
                }
                setLoading(false);
            };

            useEffect(() => { fetchData(); }, []);

            return (
                <div className="min-h-screen p-4 md:p-8 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-purple-900/20 via-black to-black">
                    <div className="max-w-4xl mx-auto border border-purple-500/30 bg-black/60 backdrop-blur-xl rounded-xl overflow-hidden shadow-2xl shadow-purple-500/20">
                        
                        <header className="p-6 border-b border-purple-500/30 bg-purple-900/10">
                            <h1 className="text-4xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-red-500 italic">
                                SSS-INDIA
                            </h1>
                            <p className="text-xs font-mono text-purple-400 mt-2 uppercase tracking-widest">
                                [ SYSTEM_STATUS: INITIALIZED // ARCHITECT: SYED_ISMAEEL ]
                            </p>
                        </header>

                        <nav className="flex bg-black/40">
                            <button onClick={() => setActiveTab('mission')} className={`flex-1 p-4 font-mono text-sm transition-all ${activeTab === 'mission' ? 'bg-purple-600/20 text-purple-300 border-b-2 border-purple-500' : 'text-gray-500'}`}>MISSION.md</button>
                            <button onClick={() => setActiveTab('ledger')} className={`flex-1 p-4 font-mono text-sm transition-all ${activeTab === 'ledger' ? 'bg-red-600/20 text-red-300 border-b-2 border-red-500' : 'text-gray-500'}`}>GARBAGE_LEDGER.md</button>
                        </nav>

                        <main className="p-6 min-h-[400px]">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-64 text-purple-500 animate-pulse font-mono">
                                    <p>> DECRYPTING_SIGNAL...</p>
                                </div>
                            ) : (
                                <pre className="whitespace-pre-wrap font-mono text-sm leading-relaxed text-gray-300 bg-black/20 p-4 rounded border border-white/5">
                                    {activeTab === 'mission' ? mission : ledger}
                                </pre>
                            )}
                        </main>

                        <footer className="p-4 border-t border-white/5 text-[10px] text-center text-gray-600 font-mono">
                            PRODUCED BY SSS-INDIA ORG // NO PERMISSION REQUIRED
                        </footer>
                    </div>
                </div>
            );
        }
// --- CONFIGURATION GATE ---
const GITHUB_ORG = 'secular-syncretic-society-of-india'; 
const GITHUB_REPO = 'Syncretic-secular-society-of-India';
const BRANCH = 'main';
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
