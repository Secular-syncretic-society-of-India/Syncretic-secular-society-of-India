<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSS-INDIA | Sovereign Motherboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            100% { transform: translate(0); }
        }
        .glitch-text:hover { animation: glitch 0.2s infinite; }
    </style>
</head>
<body class="bg-black text-gray-300 font-mono">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- THE SOVEREIGN IDENTITY GATE ---
        const GITHUB_ORG = 'secular-syncretic-society-of-india'; 
        const GITHUB_REPO = 'Syncretic-secular-society-of-India';
        const BRANCH = 'main';

        function Dashboard() {
            const [mission, setMission] = useState('');
            const [ledger, setLedger] = useState('');
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('mission');

            const fetchData = async () => {
                setLoading(true);
                try {
                    // Fetching raw content from the Motherboard
                    const mRes = await fetch(`https://raw.githubusercontent.com/${GITHUB_ORG}/${GITHUB_REPO}/${BRANCH}/MISSION.md`);
                    const lRes = await fetch(`https://raw.githubusercontent.com/${GITHUB_ORG}/${GITHUB_REPO}/${BRANCH}/GARBAGE_LEDGER.md`);
                    
                    if (!mRes.ok || !lRes.ok) throw new Error("Data Blocked");
                    
                    setMission(await mRes.text());
                    setLedger(await lRes.text());
                } catch (e) {
                    console.error("Signal Lost:", e);
                    setMission("ERROR: MISSION.md NOT FOUND OR REPO IS PRIVATE.");
                    setLedger("ERROR: GARBAGE_LEDGER.md NOT FOUND.");
                }
                setLoading(false);
            };

            useEffect(() => { fetchData(); }, []);

            return (
                <div className="min-h-screen p-4 md:p-8 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-purple-900/20 via-black to-black">
                    <div className="max-w-4xl mx-auto border border-purple-500/30 bg-black/60 backdrop-blur-xl rounded-xl shadow-2xl shadow-purple-500/20">
                        
                        <header className="p-6 border-b border-purple-500/30">
                            <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-red-500 italic glitch-text">
                                SSS-INDIA
                            </h1>
                            <p className="text-[10px] text-purple-400 mt-2 uppercase tracking-widest">
                                [ SYSTEM_STATUS: ONLINE // ARCHITECT: SYED_ISMAEEL ]
                            </p>
                        </header>

                        <nav className="flex border-b border-white/5">
                            <button onClick={() => setActiveTab('mission')} className={`flex-1 p-4 text-xs transition-all ${activeTab === 'mission' ? 'bg-purple-600/20 text-purple-300 border-b-2 border-purple-500' : 'text-gray-600'}`}>MISSION.md</button>
                            <button onClick={() => setActiveTab('ledger')} className={`flex-1 p-4 text-xs transition-all ${activeTab === 'ledger' ? 'bg-red-600/20 text-red-300 border-b-2 border-red-500' : 'text-gray-600'}`}>GARBAGE_LEDGER.md</button>
                        </nav>

                        <main className="p-6 min-h-[400px]">
                            {loading ? (
                                <div className="flex items-center justify-center h-64 text-purple-500 animate-pulse text-xs">
                                    > DECRYPTING_SIGNAL...
                                </div>
                            ) : (
                                <pre className="whitespace-pre-wrap text-sm leading-relaxed text-gray-400 bg-black/40 p-4 rounded border border-white/5 overflow-x-auto">
                                    {activeTab === 'mission' ? mission : ledger}
                                </pre>
                            )}
                        </main>

                        <footer className="p-4 text-[10px] text-center text-gray-700 border-t border-white/5">
                            SOURCE: {GITHUB_ORG}/{GITHUB_REPO} // SECURE_CONNECTION: ESTABLISHED
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
